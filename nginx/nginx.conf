events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    upstream backend_servers {
        least_conn;
        server backend:3001 max_fails=3 fail_timeout=30s;
    }

    upstream frontend_servers {
        least_conn;
        server frontend:3000 max_fails=3 fail_timeout=30s;
    }

    # Security headers
    map $http_user_agent $bad_client {
        default 0;
        ~*(wordpress|wp|scanner) 1;
    }

    # Map to detect social media crawlers
    map $http_user_agent $is_crawler {
        default 0;
        ~*(facebook|twitter|linkedin|whatsapp|telegram|discord|skype|slack|pinterest|googlebot|bingbot|slackbot|twitterbot|facebookexternalhit|linkedinbot|discordbot|telegrambot|whatsappbot|pinterestbot) 1;
    }

    # Map for WebSocket connection upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Define allowed origins map before server blocks
    map $http_origin $allow_origin {
        'https://www.jabick.site' $http_origin;
        'https://api.jabick.site' $http_origin;
        'http://localhost:3000' $http_origin;
        'http://127.0.0.1:3000' $http_origin;
        'http://locslhost:5173' $http_origin;
        default '';
    }

    # HTTP server (for local development and testing)
    server {
        listen 80;
        server_name localhost;

        # Special handling for product pages when accessed by crawlers
        location ~ ^/products/([a-zA-Z0-9]+)$ {
            # Use a variable to determine the upstream
            set $upstream frontend_servers;
            
            # If it's a crawler, change upstream to backend
            if ($is_crawler) {
                set $upstream backend_servers;
            }
            
            # Proxy to the determined upstream
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header User-Agent $http_user_agent;
            
            # Add upgrade headers for frontend WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
        }

        location / {
            proxy_pass http://frontend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Frontend application (www.jabick.site)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name www.jabick.site jabick.site;

        # SSL configuration
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Special handling for product pages when accessed by crawlers
        location ~ ^/products/([a-zA-Z0-9]+)$ {
            # Use a variable to determine the upstream
            set $upstream frontend_servers;
            
            # If it's a crawler, change upstream to backend
            if ($is_crawler) {
                set $upstream backend_servers;
            }
            
            # Proxy to the determined upstream
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header User-Agent $http_user_agent;
            
            # Add upgrade headers for frontend WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
        }

        location / {
            # Security headers for frontend only
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin" always;
            add_header Content-Security-Policy "default-src 'self' https: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob: https: *; font-src 'self' https: data: fonts.gstatic.com fonts.googleapis.com; style-src 'self' 'unsafe-inline' https: fonts.googleapis.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; connect-src 'self' https: wss: ws:;" always;

            proxy_pass http://frontend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Block WordPress scans
        if ($bad_client) {
            return 444;
        }
    }

    # Backend API (api.jabick.site)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.jabick.site;

        # SSL configuration
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Increase timeout for OAuth callbacks
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Single location block for API with CORS
        location / {
            # CORS headers only added once
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$allow_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 1728000;
                return 204;
            }

            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # CORS headers for actual requests
            add_header 'Access-Control-Allow-Origin' '$allow_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Specific location for Socket.IO WebSocket connections
        location /socket.io/ {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            
            # WebSocket specific headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # CORS headers for WebSocket
            add_header 'Access-Control-Allow-Origin' '$allow_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            
            # WebSocket specific timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # Specific location for Google OAuth callback
        location /auth/google/callback {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Increased timeouts for OAuth
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}